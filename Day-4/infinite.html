<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      .cards {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        padding: 50px;
        gap: 20px;
      }
      @keyframes rotation {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .spin {
        width: 30px;
        height: 30px;
        border: 4px solid black;
        border-radius: 50%;
        border-bottom: 4px solid cyan;
        animation: rotation 1s linear infinite;
      }
      .card {
        width: 50vw;
        height: 30vh;
        display: flex;
        flex-direction: column;
        gap: 10px;
        border-radius: 6px;
        padding: 20px;
        border: 1px solid black;
      }
      .sentinel {
        display: flex;
        justify-content: center;
        font-size: 36px;
        margin-bottom: 10px;
      }
      .spintop {
        display: flex;
        justify-content: center;
      }
      .retry {
        display: none;
        justify-content: center;
      }
      .retry img {
        padding: 5px;
        cursor: pointer;
        border-radius: 50%;
      }
      .retry img:hover {
        background-color: rgba(128, 128, 128, 0.363);
      }
    </style>
    <title>Infinite</title>
  </head>
  <body>
    <div class="cards"></div>
    <div class="retry">
      <img onclick="onLoad()"
        width="40"
        src="https://img.icons8.com/?size=100&id=11684&format=png&color=000000"
        alt=""
      />
    </div>
    <div class="spintop">
      <div class="spin"></div>
    </div>
    <div class="sentinel"></div>
    <script src="infinite.js"></script>
  </body>
</html>
